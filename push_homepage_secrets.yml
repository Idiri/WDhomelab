---
# Kjøres manuelt av mennesket ETTER at homepage_vars.yml er fylt inn med ekte
# token-verdier via `ansible-vault edit homepage_vars.yml`. Rendrer og pusher .env
# til container 203 uten at hemmeligheten noensinne skrives til stdout/logg.
- name: Push Homepage API-hemmeligheter til container 203
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - homepage_vars.yml
  tasks:
    - name: Render midlertidig .env lokalt
      copy:
        content: |
          HOMEPAGE_VAR_PROXMOX_TOKEN_ID={{ homepage_proxmox_token_id }}
          HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET={{ homepage_proxmox_token_secret }}
          HOMEPAGE_VAR_PROXMOX_AUTH_HEADER=PVEAPIToken={{ homepage_proxmox_token_id }}={{ homepage_proxmox_token_secret }}
        dest: /root/.homepage.env.tmp
        mode: "0600"
      no_log: true

    - name: Scp midlertidig .env til proxmox-host
      # pct push sin kildesti er lokal til proxmox-hosten (der pct selv kjører),
      # ikke til mgmt-node hvor Ansible kjører — samme fallgruve som dokumentert
      # i setup_homepage.yml. Uten dette steget leser pct push en fil som ikke
      # finnes på proxmox og "lykkes" likevel (se failed_when under).
      command: "scp /root/.homepage.env.tmp root@192.168.1.50:/root/.homepage.env.tmp"
      no_log: true

    - name: Push .env til container 203
      command: "ssh root@192.168.1.50 pct push 203 /root/.homepage.env.tmp /opt/homepage/.env"
      register: push_env
      failed_when: "'failed to open' in push_env.stdout"
      no_log: true

    - name: Fjern midlertidig .env-fil på proxmox-host
      command: "ssh root@192.168.1.50 rm -f /root/.homepage.env.tmp"
      no_log: true

    - name: Fjern midlertidig lokal .env-fil
      file:
        path: /root/.homepage.env.tmp
        state: absent

    - name: Restart Homepage for å laste inn nye variabler
      command: "ssh root@192.168.1.50 pct exec 203 -- sh -c 'cd /opt/homepage && docker compose up -d --force-recreate'"
