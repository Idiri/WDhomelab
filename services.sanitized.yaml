---
# SANITIZED demo variant of services.yaml — for public screenshots only.
# All IPs below use RFC 5737 documentation ranges (192.0.2.0/24, 198.51.100.0/24,
# 203.0.113.0/24), which are reserved by IANA and never route on a real network.
# No real host IPs, no Tailscale IP, no tokens. Generate with:
#   sed -f sanitize.sed services.yaml > services.sanitized.yaml
# (see sanitize.sed in this same directory for the exact substitution list)

- Infrastruktur (vmbr0 — Admin):
    - Proxmox:
        icon: proxmox.png
        href: https://203.0.113.10:8006
        description: Hypervisor
        widgets:
          - type: proxmox
            url: https://203.0.113.10:8006
            username: "demo-token-id"
            password: "demo-token-secret"
            node: proxy
          - type: uptimekuma
            url: http://203.0.113.20:3001
            slug: proxmox-host
          - type: customapi
            url: https://203.0.113.10:8006/api2/json/nodes/proxy/status
            headers:
              Authorization: "demo-auth-header"
            mappings:
              - field: data.rootfs.used
                label: Disk brukt
                format: bytes
              - field: data.rootfs.total
                label: Disk totalt
                format: bytes

    - mgmt-node:
        icon: mdi-ansible
        href: http://203.0.113.11
        description: Ansible-kontrollnode
        widget:
          type: uptimekuma
          url: http://203.0.113.20:3001
          slug: mgmt-node

    - OPNsense:
        icon: opnsense.png
        href: https://198.51.100.1
        description: >-
          Firewall/gateway for lab-nettet. Lenken fungerer kun fra Kali eller via
          en eksisterende SSH-tunnel — ingen direkte rute fra admin-segmentet.
        widget:
          type: uptimekuma
          url: http://203.0.113.20:3001
          slug: opnsense

    - web-01:
        icon: nginx.png
        href: http://203.0.113.12
        description: Nginx 1.22.1 — mål-webserver
        widget:
          type: uptimekuma
          url: http://203.0.113.20:3001
          slug: web-01

    - Isolasjon (lab-segment -> admin-segment):
        icon: mdi-shield-lock
        description: >-
          Inter-segment brannmur-sjekk, oppdatert av en systemd-timer på
          mgmt-node som sjekker over det isolerte segmentet
        widget:
          type: customapi
          url: http://status-api:8080/isolation.json
          mappings:
            - field: status
              label: Status
              format: text
            - field: http_code
              label: HTTP-kode
              format: text
            - field: last_checked
              label: Sist sjekket
              format: text

    - Backup-status:
        icon: mdi-database-clock
        description: >-
          Snapshot/backup-alder, oppdatert av en systemd-timer på Proxmox-hosten
        widget:
          type: customapi
          url: http://status-api:8080/backups.json
          mappings:
            - field: opnsense_snapshot_days_ago
              label: OPNsense snapshot
              format: text
            - field: metasploitable_snapshot_days_ago
              label: Metasploitable snapshot
              format: text
            - field: last_vzdump_days_ago
              label: Siste vzdump
              format: text
            - field: last_checked
              label: Sist sjekket
              format: text

- Angrepslab (vmbr1 — Isolert Lab):
    - Kali:
        icon: kali-linux.png
        href: http://198.51.100.10
        description: Angrepsnode (dual-homed) — kun lenke, ingen stats
        widget:
          type: uptimekuma
          url: http://203.0.113.20:3001
          slug: kali-01

    - Metasploitable:
        icon: mdi-skull
        description: >-
          Bevisst sårbart mål (198.51.100.176) — ikke en reell tjeneste.
          Strukturelt isolert på lab-segmentet, ingen rute fra admin-segmentet.
        widget:
          type: uptimekuma
          url: http://203.0.113.20:3001
          slug: metasploitable
