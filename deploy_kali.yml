---
- name: Deploy Kali container
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Opprett Kali container 202
      command: >
        ssh root@192.168.1.50
        pct create 202
        local:vztmpl/kali-current-amd64-rootfs.tar.xz
        --hostname kali-01
        --cores 2
        --memory 2048
        --swap 1024
        --rootfs local:12
        --net0 name=eth0,bridge=vmbr0,ip=192.168.1.202/24,gw=192.168.1.254
        --nameserver 8.8.8.8
        --unprivileged 1
